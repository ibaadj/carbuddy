<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Car Buddy</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --ui: rgba(20,20,20,.88); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; overflow: hidden;
               font: 15px/1.3 system-ui, sans-serif; user-select: none; touch-action: manipulation; }

  /* Layers: shift (slow burn-in drift) > stage (screen shake) > head (physics) > squish (squash) > canvas */
  #shift { position: fixed; inset: 0; transition: transform 30s linear, opacity 2s; }
  body.night #shift { opacity: .55; }                 /* night mode: dimmer */
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #head { position: relative; width: min(94vw, calc(94vh * 1.439)); aspect-ratio: 1820 / 1265; will-change: transform; }
  #head.crumbled { visibility: hidden; }
  #pile { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  #squish { width: 100%; height: 100%; will-change: transform; }
  #squish canvas { width: 100% !important; height: 100% !important; display: block; }

  #stage.shake { animation: shake 380ms linear; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(calc(var(--s) * -1px), calc(var(--s) * .6px)); }
    30% { transform: translate(calc(var(--s) * .9px), calc(var(--s) * -.8px)); }
    45% { transform: translate(calc(var(--s) * -.6px), calc(var(--s) * .9px)); }
    60% { transform: translate(calc(var(--s) * .5px), calc(var(--s) * -.4px)); }
    80% { transform: translate(calc(var(--s) * -.2px), calc(var(--s) * .2px)); }
  }

  /* Sunglasses (long smooth cruise) */
  #shades { position: absolute; left: 22%; top: 16.5%; width: 55.6%; pointer-events: none; opacity: 0;
            transform: translateY(-180%) rotate(-10deg);
            transition: transform .5s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; }
  #shades.on { opacity: 1; transform: none; }
  #shades.fly { opacity: 0; transform: translate(70%, -280%) rotate(50deg); transition: transform .55s ease-in, opacity .55s; }
  /* Carsick green tint */
  #squish canvas { transition: filter 1.2s; }
  body.sick #squish canvas { filter: sepia(1) hue-rotate(50deg) saturate(3.2) brightness(1.05); }
  #head { cursor: pointer; }

  /* Dizzy stars orbiting above the head */
  #stars { position: absolute; left: 50%; top: -2%; width: 46%; height: 16%; transform: translateX(-50%);
           opacity: 0; transition: opacity .25s; pointer-events: none; }
  #stars.on { opacity: 1; }
  #stars span { position: absolute; left: 50%; top: 20%; font-size: 7vmin; color: #ffd400; margin-left: -.5em;
                animation: orbit 0.9s linear infinite; text-shadow: 0 0 6px #000; }
  #stars span:nth-child(2) { animation-delay: -.3s; } #stars span:nth-child(3) { animation-delay: -.6s; }
  @keyframes orbit {
    0% { transform: translateX(-130%) scale(.7); opacity: .8; } 25% { transform: translateX(0) scale(1.15); opacity: 1; }
    50% { transform: translateX(130%) scale(.7); opacity: .8; } 75% { transform: translateX(0) scale(.45); opacity: .5; }
    100% { transform: translateX(-130%) scale(.7); opacity: .8; }
  }

  /* Comic words and glass cracks */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .burst { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)) scale(0);
           font: italic 900 clamp(34px, 11vmin, 110px)/1 Impact, "Arial Black", system-ui, sans-serif;
           color: #ffd400; -webkit-text-stroke: .06em #000; paint-order: stroke fill;
           text-shadow: .07em .07em 0 #e0006a; letter-spacing: .02em; white-space: nowrap;
           animation: pop 1100ms ease-out forwards; }
  .burst.back { color: #6cf2ff; text-shadow: .07em .07em 0 #2b6cff; }
  .burst.sick { color: #b6ff7a; text-shadow: .07em .07em 0 #2d7a1f; }
  .burst.poke { font-size: clamp(26px, 7vmin, 70px); color: #fff; text-shadow: .07em .07em 0 #e0006a; }
  .burst.small { font-size: clamp(22px, 6vmin, 60px); }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) rotate(var(--r)) scale(.2); opacity: 0; }
    12% { transform: translate(-50%, -50%) rotate(var(--r)) scale(1.3); opacity: 1; }
    25% { transform: translate(-50%, -50%) rotate(var(--r)) scale(1); }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(var(--r)) scale(1.08); opacity: 0; }
  }
  #crack { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  #crack.on { opacity: 1; }
  #crack.fade { opacity: 0; transition: opacity .9s ease-in; }

  /* UI */
  .panel { position: fixed; background: var(--ui); border-radius: 14px; padding: 10px; transition: opacity .3s; z-index: 5; }
  .hidden { opacity: 0; pointer-events: none; }
  button { font: inherit; color: #fff; background: #2b2b2b; border: 0; border-radius: 10px; padding: 10px 14px; margin: 3px; }
  button.primary { background: #2b6cff; }
  button.on { background: #2b6cff; }
  #intro { inset: 0; margin: auto; width: min(420px, 92vw); height: fit-content; text-align: center; padding: 18px; }
  #intro h1 { font-size: 20px; margin: 4px 0 6px; }
  #intro p { color: #aaa; font-size: 13px; margin: 6px 0 12px; }
  #intro button { width: 100%; padding: 14px; margin: 5px 0; font-size: 16px; }
  #bar { top: 8px; left: 8px; right: 60px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  /* Small, dim menu button — the only way to open the controls */
  #menuBtn { position: fixed; top: 10px; right: 10px; z-index: 6; width: 44px; height: 44px; padding: 0; margin: 0;
             border-radius: 50%; background: rgba(40,40,40,.6); font-size: 22px; line-height: 44px; opacity: .25; transition: opacity .3s; }
  #menuBtn:hover, #menuBtn.open { opacity: 1; }
  /* Status messages appear as a small pill that fades away on its own */
  #toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(560px, 80vw); z-index: 4;
           background: rgba(20,20,20,.85); color: #ccc; font-size: 13px; padding: 7px 12px; border-radius: 999px;
           pointer-events: none; transition: opacity .5s; text-align: center; }
  #toast.warn { color: #ffcf80; } #toast.ok { color: #9be7a8; }
  #status { flex: 1 1 200px; font-size: 13px; color: #bbb; padding: 0 6px; }
  #status.warn { color: #ffcf80; } #status.ok { color: #9be7a8; }
  #sim { bottom: 8px; left: 50%; transform: translateX(-50%); text-align: center; width: min(640px, 96vw); }
  #sim .row { display: flex; justify-content: center; flex-wrap: wrap; }
  #sim .hold { min-width: 76px; padding: 12px 8px; touch-action: none; }
  #sim .hold.active { background: #2b6cff; }
  #sim .hold.big { background: #5a2330; } #sim .hold.big.active { background: #e0006a; }
  #sim .hint { font-size: 11px; color: #888; margin-top: 4px; }
  #debug { left: 8px; bottom: 8px; font: 12px/1.35 ui-monospace, monospace; color: #9f9; padding: 8px 10px; white-space: pre; pointer-events: none; }

  /* Simulator open: shrink the stage so the panels don't cover the play area */
  body.simmode #stage { inset: 64px 0 220px 0; }
  body.simmode #head { width: min(70vw, calc((100vh - 380px) * 1.439)); }

  @media (prefers-reduced-motion: reduce) {
    #stage.shake { animation: none; } #shift { transition: opacity 2s; } #stars span { animation: none; }
    #shades, #shades.fly { transition: opacity .3s; transform: none; }
    .burst { animation: fade 1100ms ease-out forwards; transform: translate(-50%, -50%); }
    @keyframes fade { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  }
</style>
</head>
<body>
  <div id="shift"><div id="stage">
    <div id="head"><div id="squish"></div>
      <svg id="shades" viewBox="0 0 100 33" aria-hidden="true">
        <path d="M3,5 H97 V9 H3 Z" fill="#0d0d0d"/>
        <rect x="7" y="6" width="38" height="23" rx="9" fill="#050505" stroke="#2a2a2a" stroke-width="1.2"/>
        <rect x="55" y="6" width="38" height="23" rx="9" fill="#050505" stroke="#2a2a2a" stroke-width="1.2"/>
        <path d="M45,11 Q50,7.5 55,11" stroke="#0d0d0d" stroke-width="3.5" fill="none"/>
        <path d="M13,11 L24,11 M13,15 L18,15 M61,11 L72,11 M61,15 L66,15" stroke="rgba(255,255,255,.35)" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div></div>
  </div></div>
  <canvas id="pile" aria-hidden="true"></canvas>
  <div id="fx"><svg id="crack" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div id="intro" class="panel">
    <h1>Car Buddy</h1>
    <p>Mount the phone, tap <b>Car mode</b>, then <b>Calibrate</b> while parked facing forward.<br>
       Or try the <b>Simulator</b> on any device.</p>
    <button id="carBtn" class="primary">Car mode</button>
    <button id="simBtn">Simulator</button>
  </div>

  <button id="menuBtn" class="hidden" aria-label="Menu">⋯</button>
  <div id="toast" class="hidden"></div>
  <div id="bar" class="panel hidden">
    <span id="status">—</span>
    <button id="calBtn">Calibrate</button>
    <button id="relearnBtn">Re-learn forward</button>
    <button id="forgetBtn">Reset calibration</button>
    <button id="soundBtn">Sound on</button>
    <button id="styleBtn">Style: ASCII</button>
    <button id="simToggle">Simulator</button>
    <button id="debugToggle">Debug</button>
    <button id="hideBtn">Hide</button>
    <a href="sensors/"><button>Sensor test</button></a>
  </div>

  <div id="sim" class="panel hidden">
    <div class="row">
      <button class="hold" data-k="left">◀ Left</button>
      <button class="hold" data-k="gas">▲ Gas</button>
      <button class="hold" data-k="brake">▼ Brake</button>
      <button class="hold" data-k="right">Right ▶</button>
    </div>
    <div class="row">
      <button class="hold big" data-k="sharpLeft">◀◀ Sharp</button>
      <button class="hold big" data-k="floor">Floor it</button>
      <button class="hold big" data-k="hard">Slam brakes</button>
      <button class="hold big" data-k="sharpRight">Sharp ▶▶</button>
    </div>
    <div class="row">
      <button id="bumpBtn">Bump</button>
      <button id="replayBtn">Replay drive #2</button>
      <button id="speedBtn">1×</button>
      <button id="napBtn">Nap test</button>
    </div>
    <div class="row">
      <button id="cruiseBtn">Highway test</button>
      <button id="sickBtn">Carsick test</button>
      <button id="idleBtn">Idle bit</button>
      <button id="nightBtn">Night: auto</button>
    </div>
    <div class="hint">Keys: ↑ gas · ↓ brake · ← → turn · hold Shift for the dramatic version · Space bump · R replay · D debug · H hide/show controls · tap the face to poke it</div>
  </div>

  <div id="debug" class="panel hidden"></div>

<script src="js/dog-paths.js"></script>
<script src="js/dog.js"></script>
<script src="js/ascii.js"></script>
<script src="js/motion.js"></script>
<script src="js/sfx.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------------------------------------------------------- The dog
// Drawn from Ibaad's own artwork (js/dog.js). Shown as live colored ASCII by default,
// or as the plain drawing ("Style" in the menu, remembered on this device).
const STYLE_KEY = "carbuddy.style";
let style = "ascii";
try { style = localStorage.getItem(STYLE_KEY) || "ascii"; } catch (err) { /* ignore */ }
const faceCanvas = document.createElement("canvas");
faceCanvas.setAttribute("role", "img"); faceCanvas.setAttribute("aria-label", "Car Buddy, a golden retriever");
$("squish").appendChild(faceCanvas);
const ascii = new AsciiRenderer(faceCanvas, { cols: 72 });
const crumble = new Crumble($("pile"), ascii);
const pose = { eyes: "open", mouth: null, earL: 0, earR: 0, spin: 0 };
const EARS = { L: 0, vL: 0, R: 0, vR: 0 };
let blinkUntil = 0, nextBlink = performance.now() + 3000, lastAscii = 0;
function layoutFace() { ascii.layout($("head").offsetWidth, $("head").offsetHeight); lastAscii = 0; }

// Which expression for which moment (easy to tweak)
const LOOK = {
  neutral: "shocked",          // calm pill eyes
  accel: "excited", accelHard: "starstruck",
  brake: "wow", brakeHard: "scared",
  turn: "happy", turnSharp: "flustered",
  bump: "giggle",
  bored: "bored", sleep: "snoozing", wake: "realized-something",
};
// Expression sequences after a crash: [expression, ms]
const CRASH_FACE = {
  side:  [["flustered", 1600]],
  top:   [["flustered", 1400]],
  glass: [["scared", 600], ["flustered", 1200], ["exhausted", 700]],
  back:  [["starstruck", 1200]],
};
const CRASH_WORDS = {
  side: ["BONK!", "THWACK!", "OOF!", "BAM!", "WHAM!"],
  top: ["CLONK!", "BOING!", "DONK!", "OUCH!"],
  glass: ["SPLAT!", "SMOOSH!", "SPLOT!"],
  back: ["WHEEE!", "ZOOOM!", "YEEHAW!"],
};
const CRASH_SOUND = { side: "bonk", top: "clonk", glass: "splat", back: "wheee" };

// Idle personality bits: [expression, ms, optional gaze [x, y]]
const IDLE_BITS = [
  [["shocked", 700, [0.2, 0.5]], ["shocked", 700, [0.8, 0.5]], ["shocked", 500, [0.5, 0.35]], ["thinking", 1300]], // look around
  [["winking", 900]],
  [["mischievous", 1600, [0.75, 0.6]]],
  [["happy", 1500]],
  [["thinking", 1800, [0.3, 0.3]]],
  [["bored", 2200, [0.5, 0.7]]],
  [["sassy", 1300]],
  [["in-love", 1300]],
  [["tired", 1800]],   // yawn
];
const NIGHT_BITS = [[["tired", 2000]], [["exhausted", 1800]], [["tired", 1200], ["snoozing", 1500], ["realized-something", 700]]];

const LINGER_MS = 700, SNOOZE_MS = 45000, SNOOZE_NIGHT_MS = 20000, WAKE_MS = 1500;
const COOL_MS = 40000;          // smooth driving this long → sunglasses
const SICK_TURNS = 4, SICK_WINDOW = 25000, SICK_MS = 15000;  // this many turns in 25 s → carsick

let shown = null, lastEventAt = performance.now(), reaction = null, reactionUntil = 0;
let parkedSince = null, sleeping = false, wakeUntil = 0, lastEvent = "cruising", forceNap = false;
let act = null, actGaze = null;       // a short scripted sequence that overrides the face
let cool = false, sickUntil = 0, turnTimes = [], nextIdleAt = performance.now() + 20000;
let night = false, nightForced = null, nextSnoreAt = 0;
const isSick = (now) => now < sickUntil;

// Play a sequence of [expression, ms, gaze]. Higher prio wins: 1 idle · 2 poke/sick · 3 crash
function playAct(steps, prio, now) {
  if (act && act.prio > prio && now < act.steps[act.steps.length - 1][1]) return false;
  let t = now;
  act = { prio, steps: steps.map(([e, ms, g]) => [e, (t += ms), g || null]) };
  return true;
}
function currentAct(now) {
  if (!act) return null;
  const st = act.steps.find((x) => now < x[1]);
  if (!st) act = null;
  return st || null;
}

const DRIVING = { BRAKING: 1, ACCELERATING: 1, "TURNING LEFT": 1, "TURNING RIGHT": 1, BUMP: 1 };

function decide(s, now) {
  let e = null;
  switch (s.event) {
    case "BRAKING": e = s.fwd < -2.5 ? LOOK.brakeHard : LOOK.brake; break;
    case "ACCELERATING": e = s.fwd > 2.2 ? LOOK.accelHard : LOOK.accel; break;
    case "TURNING LEFT": case "TURNING RIGHT": e = Math.abs(s.yaw) > 22 ? LOOK.turnSharp : LOOK.turn; break;
    case "BUMP": e = LOOK.bump; break;
  }
  if (e) { lastEventAt = now; reaction = e; reactionUntil = now + LINGER_MS; }

  if (e && act && act.prio <= 1) act = null;            // driving interrupts idle bits
  const st = currentAct(now);
  actGaze = st ? st[2] : null;
  if (st) return st[0];

  if (!e && now < reactionUntil) e = reaction;

  // Parked = very little road vibration (with hysteresis so it doesn't flicker)
  const parked = !e && Math.abs(s.yaw) < 2 && s.activity < (parkedSince != null ? 0.5 : 0.3);
  if (parked) { if (parkedSince == null) parkedSince = now; } else parkedSince = null;

  if (forceNap && (e || s.activity >= 0.5)) forceNap = false;   // simulator "Nap test" until you move
  const snoozeAfter = night ? SNOOZE_NIGHT_MS : SNOOZE_MS;
  if (forceNap || (parkedSince != null && now - parkedSince > snoozeAfter)) {
    if (!sleeping) setCool(false);
    sleeping = true;
    if (now > nextSnoreAt) { Sfx.play("snore"); nextSnoreAt = now + 3800; }
    return LOOK.sleep;
  }
  if (sleeping) { sleeping = false; wakeUntil = now + WAKE_MS; Sfx.play("ding"); }
  if (now < wakeUntil) return LOOK.wake;
  if (e) return e;
  if (cool) return "tired";                 // relaxed eyes behind the sunglasses
  if (isSick(now)) return "tired";
  return LOOK.neutral;
}

// Called once when a new driving event starts
function onEventStart(ev, now) {
  if (!DRIVING[ev]) return;
  lastEventAt = now;
  if (cool) setCool(false, true);
  if (ev === "TURNING LEFT" || ev === "TURNING RIGHT") {
    turnTimes = turnTimes.filter((t) => now - t < SICK_WINDOW);
    turnTimes.push(now);
    if (turnTimes.length >= SICK_TURNS && !isSick(now)) getSick(now);
  }
}

function getSick(now) {
  sickUntil = now + SICK_MS; turnTimes = [];
  document.body.classList.add("sick");
  playAct([["flustered", 1300], ["exhausted", 1600]], 2, now);
  burst("sick", pick(["BLEGH…", "UGH…", "URP!"]), 50, 18);
  Sfx.play("blegh");
}

function setCool(on, fly) {
  if (cool === on) return;
  cool = on;
  const el = $("shades");
  if (on) { el.classList.remove("fly"); el.classList.add("on"); Sfx.play("cool"); }
  else { el.classList.remove("on"); if (fly) { el.classList.add("fly"); setTimeout(() => el.classList.remove("fly"), 700); } }
}

function updateNight() {
  const h = new Date().getHours();
  night = nightForced != null ? nightForced : (h >= 21 || h < 6);
  document.body.classList.toggle("night", night);
}
updateNight();
setInterval(updateNight, 60000);

// ---------------------------------------------------------------- Head physics
// The head is a springy body inside the screen. The car's forces push it around;
// the screen edges (x, y) and the glass in front / seat behind (z) are walls.
// Units: ±1 = touching a wall.  x: + right · y: + down · z: + toward you
const P = { x: 0, vx: 0, y: 0, vy: 0, z: 0, vz: 0 };
const AX = {
  x: { k: 38, c: 7.5 },
  y: { k: 45, c: 6 },
  z: { k: 32, c: 7 },
};
const PHYS = {
  yawToWall: 22,     // °/s of turning that pins the head to the side wall
  latToWall: 2.8,    // or this much sideways force (m/s²)
  fwdToWall: 2.3,    // m/s² of braking that reaches the glass (or accel → seat)
  bumpKick: 15,      // upward launch speed on a bump (walls/s)
  impactV: 1.4,      // minimum impact speed for crash effects
  bounce: 0.35,      // how much speed survives a bounce
};
let squash = { axis: null, side: 0, a: 0 };
let travel = { x: 100, y: 60 };
let lastFx = 0;

function measure() {
  const st = $("stage").getBoundingClientRect(), hw = $("head").offsetWidth, hh = $("head").offsetHeight;
  travel.x = Math.max((st.width - hw) / 2, hw * 0.18);
  travel.y = Math.max((st.height - hh) / 2, hh * 0.12);
  layoutFace();
}
addEventListener("resize", measure);

function physics(s, dt, now) {
  if (reducedMotion) { P.x = P.y = P.z = 0; return; }
  const fromYaw = s.yaw / PHYS.yawToWall, fromLat = -s.lat / PHYS.latToWall;
  const T = {
    x: (Math.abs(fromYaw) > Math.abs(fromLat) ? fromYaw : fromLat)  // left turn → thrown right
       + (isSick(now) ? 0.18 * Math.sin(now / 380) : 0),               // carsick: woozy sway
    z: -s.fwd / PHYS.fwdToWall,                                    // braking → thrown at the glass
    y: (P.z > 0.97 && s.fwd < -0.8) ? 0.7 : 0,                     // squashed on the glass → slide down
  };
  for (const a of ["x", "y", "z"]) {
    const v = "v" + a;
    P[v] += (AX[a].k * (T[a] - P[a]) - AX[a].c * P[v]) * dt;
    P[a] += P[v] * dt;
    for (const side of [1, -1]) {
      if (P[a] * side > 1) {
        const speed = P[v] * side;
        P[a] = side;
        if (speed > 0) {
          // Crash if it hits fast, or if the force is shoving it well past the wall
          // (turns and brakes build up gradually, so the head can arrive slowly)
          const shoved = T[a] * side > 1.2 && speed > 0.3;
          if (speed > (a === "z" && side < 0 ? 0.6 : PHYS.impactV) || shoved) crash(a, side, Math.max(speed, 2), now);
          P[v] = -P[v] * PHYS.bounce;
        }
        // Pressed against the wall: stay flattened while the force keeps pushing
        const press = clamp((T[a] * side - 1) * 0.5, 0, 0.3);
        if (press > squash.a || squash.axis === a) squash = { axis: a, side, a: Math.max(squash.a, press) };
      }
    }
  }
  squash.a *= Math.exp(-dt / 0.2);
}

function crash(axis, side, speed, now) {
  const kind = axis === "x" ? "side" : axis === "y" ? (side < 0 ? "top" : null) : (side > 0 ? "glass" : "back");
  squash = { axis, side, a: clamp(0.2 + 0.12 * speed, 0.3, kind === "back" ? 0.25 : 0.7) };
  if (!kind || now - lastFx < 400) return;
  lastFx = now;
  const strength = clamp(speed / 4, 0.4, 1);

  // Comic word near the impact, plus a sound
  const pos = { side: [side > 0 ? 80 : 20, 45], top: [50, 14], glass: [50, 42], back: [50, 72] }[kind];
  burst(kind, pick(CRASH_WORDS[kind]), pos[0], pos[1]);
  Sfx.play(CRASH_SOUND[kind]);
  if (kind === "side") onEventStart("TURNING LEFT", now);   // slamming counts toward carsick

  if (kind !== "back") {
    const stg = $("stage");
    stg.style.setProperty("--s", (6 + 14 * strength).toFixed(0));
    stg.classList.remove("shake"); void stg.offsetWidth; stg.classList.add("shake");
    $("stars").classList.add("on");
    clearTimeout(crash.starTimer);
    crash.starTimer = setTimeout(() => $("stars").classList.remove("on"), 1900);
  }
  if (kind === "glass") drawCrack();

  playAct(CRASH_FACE[kind], 3, now);
}

function burst(cls, text, xPct, yPct) {
  if (cls.startsWith("poke")) document.querySelectorAll(".burst.poke").forEach((b) => b.remove());  // no pile-ups
  const el = document.createElement("div");
  el.className = "burst " + cls;
  el.textContent = text;
  el.style.left = xPct + "%"; el.style.top = yPct + "%";
  el.style.setProperty("--r", (Math.random() * 30 - 15).toFixed(0) + "deg");
  $("fx").appendChild(el);
  setTimeout(() => el.remove(), 1150);
}

function drawCrack() {
  const svg = $("crack");
  const w = innerWidth, h = innerHeight, cx = w / 2 + (Math.random() - 0.5) * w * 0.1, cy = h * 0.45;
  let d = "";
  const n = 9;
  for (let i = 0; i < n; i++) {
    let ang = (i / n) * Math.PI * 2 + Math.random() * 0.5, x = cx, y = cy;
    d += `M${x.toFixed(0)},${y.toFixed(0)}`;
    const len = Math.min(w, h) * (0.25 + Math.random() * 0.3);
    for (let s = 0; s < 5; s++) {
      ang += (Math.random() - 0.5) * 0.6;
      x += Math.cos(ang) * len / 5; y += Math.sin(ang) * len / 5;
      d += ` L${x.toFixed(0)},${y.toFixed(0)}`;
    }
  }
  const r1 = Math.min(w, h) * 0.06, r2 = r1 * 2.2;
  const ring = (r) => {
    let p = "";
    for (let i = 0; i <= 12; i++) {
      const a = (i / 12) * Math.PI * 2, rr = r * (0.8 + Math.random() * 0.4);
      p += (i ? " L" : "M") + (cx + Math.cos(a) * rr).toFixed(0) + "," + (cy + Math.sin(a) * rr).toFixed(0);
    }
    return p;
  };
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = `<path d="${d} ${ring(r1)} ${ring(r2)}" fill="none" stroke="rgba(230,240,255,.85)" stroke-width="2.2" stroke-linejoin="round"/>` +
                  `<path d="${d}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="6"/>`;
  svg.classList.remove("fade"); svg.classList.add("on");
  clearTimeout(drawCrack.timer);
  drawCrack.timer = setTimeout(() => { svg.classList.add("fade"); svg.classList.remove("on"); }, 1300);
}

// ---------------------------------------------------------------- Speed-bump crumble (ASCII mode)
function startCrumble(now) {
  if (crumble.active || !ascii.chars) return;
  crumble.start(faceCanvas.getBoundingClientRect(),
    () => { $("head").classList.remove("crumbled"); playAct([["happy", 900]], 2, performance.now()); },
    () => Sfx.play("rebuild"));
  $("head").classList.add("crumbled");
  burst("top", pick(["KRSSHH!", "CLATTER!", "OOPS!"]), 50, 18);
  Sfx.play("crumble");
}
function styleLabel() { $("styleBtn").textContent = "Style: " + (style === "ascii" ? "ASCII" : "Drawing"); }
$("styleBtn").onclick = () => {
  style = style === "ascii" ? "drawing" : "ascii";
  try { localStorage.setItem(STYLE_KEY, style); } catch (err) { /* ignore */ }
  styleLabel(); layoutFace();
};
styleLabel();

// ---------------------------------------------------------------- Render loop
let state = { fwd: 0, lat: 0, yaw: 0, event: "cruising", activity: 0, ready: false };
let lastFrame = performance.now();

function frame(now) {
  const dt = Math.min(0.033, (now - lastFrame) / 1000); lastFrame = now;
  const s = state;

  if (s.event !== lastEvent) onEventStart(s.event, now);
  if (s.event === "BUMP" && lastEvent !== "BUMP" && !reducedMotion) {
    if (style === "ascii") startCrumble(now);            // the characters fall apart into a pile
    else { P.vy -= PHYS.bumpKick; EARS.vL += 260; EARS.vR += 260; }
  }
  lastEvent = s.event;

  // Personality: sunglasses on a long smooth drive, carsick wears off, idle bits
  if (!cool && !sleeping && !isSick(now) && s.ready && !DRIVING[s.event] && s.activity > 0.35 && now - lastEventAt > COOL_MS) setCool(true);
  if (sickUntil && !isSick(now)) { sickUntil = 0; document.body.classList.remove("sick"); }
  if (now > nextIdleAt) {
    const calm = !act && !sleeping && !cool && now > reactionUntil && now > wakeUntil && !DRIVING[s.event];
    if (calm) playAct(pick(night || isSick(now) ? NIGHT_BITS : IDLE_BITS), 1, now);
    nextIdleAt = now + 18000 + Math.random() * 17000;
  }
  physics(s, dt, now);

  const scale = P.z >= 0 ? 1 + 0.5 * P.z : 1 + 0.38 * P.z;      // glass → huge, seat → tiny
  const rot = P.x * 9 + clamp(P.vx, -4, 4) * 2.5;
  $("head").style.transform =
    `translate(${(P.x * travel.x).toFixed(1)}px, ${(P.y * travel.y).toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;

  let sx = 1, sy = 1, origin = "50% 50%";
  const a = squash.a;
  if (a > 0.005) {
    if (squash.axis === "x") { sx = 1 - 0.45 * a; sy = 1 + 0.2 * a; origin = squash.side > 0 ? "100% 50%" : "0% 50%"; }
    else if (squash.axis === "y") { sy = 1 - 0.45 * a; sx = 1 + 0.2 * a; origin = squash.side < 0 ? "50% 0%" : "50% 100%"; }
    else if (squash.axis === "z") { sx = 1 + 0.18 * a; sy = 1 - 0.12 * a; }
  }
  const sq = $("squish");
  sq.style.transformOrigin = origin;
  sq.style.transform = `scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;

  const expr = decide(s, now);

  // The dog: mood → eyes/mouth, a blink now and then, ears that swing with the motion
  const m = Dog.MOOD[expr] || Dog.MOOD.neutral;
  if (now > nextBlink) { blinkUntil = now + 140; nextBlink = now + 2500 + Math.random() * 4000; }
  pose.eyes = now < blinkUntil && (m.eyes === "open" || m.eyes === "wide") ? "closed" : m.eyes;
  pose.mouth = m.mouth || null;
  pose.spin = now / 1000;
  shown = expr;
  // Ears lag behind the head: it moves right → they swing left, it drops → they lift.
  if (!reducedMotion) {
    const sway = Math.sin(now / 900) * 2;
    const tL = clamp(-P.vx * 7 + P.vy * 6, -25, 50) + sway, tR = clamp(P.vx * 7 + P.vy * 6, -25, 50) - sway;
    EARS.vL += (60 * (tL - EARS.L) - 6 * EARS.vL) * dt; EARS.L += EARS.vL * dt;
    EARS.vR += (60 * (tR - EARS.R) - 6 * EARS.vR) * dt; EARS.R += EARS.vR * dt;
    pose.earL = clamp(EARS.L, -30, 70); pose.earR = clamp(EARS.R, -30, 70);
  }
  if (crumble.active) crumble.frame(dt, faceCanvas.getBoundingClientRect());
  else if (style === "ascii") {
    if (now - lastAscii > 33) { ascii.render((c) => Dog.draw(c, pose), Dog.viewBox, now); lastAscii = now; }   // ~30 fps is plenty for text
  } else ascii.renderPlain((c) => Dog.draw(c, pose), Dog.viewBox);

  if (debugOn) {
    $("debug").textContent =
      `event  ${s.event}\nface   ${shown}\nfwd    ${s.fwd.toFixed(2)} m/s²\nlat    ${s.lat.toFixed(2)} m/s²\n` +
      `yaw    ${s.yaw.toFixed(1)} °/s\nhead   x ${P.x.toFixed(2)} y ${P.y.toFixed(2)} z ${P.z.toFixed(2)}\n` +
      `activ  ${s.activity.toFixed(2)}\nparked ${parkedSince == null ? "-" : ((now - parkedSince) / 1000).toFixed(0) + "s"}\n` +
      `mood   ${[cool && "cool", isSick(now) && "carsick", sleeping && "asleep", night && "night", act && "act:" + act.prio].filter(Boolean).join(" ") || "-"}\n` +
      `calm   ${((now - lastEventAt) / 1000).toFixed(0)}s (shades at ${COOL_MS / 1000}s)` +
      (simOn ? `\nspeed  ${(sim.speed * 3.6).toFixed(0)} km/h` : "") +
      (replay ? `\nreplay ${replay.t.toFixed(1)}s / ${replay.end.toFixed(0)}s` : "");
  }
  requestAnimationFrame(frame);
}

// Slow pixel shift so the static parts don't burn into the OLED screen
function pixelShift() {
  if (reducedMotion) return;
  $("shift").style.transform = `translate(${(Math.random() * 3 - 1.5).toFixed(2)}%, ${(Math.random() * 3 - 1.5).toFixed(2)}%)`;
}
setInterval(pixelShift, 60000);

// ---------------------------------------------------------------- Motion engine
let toastTimer = null;
function setStatus(msg, kind) {
  const el = $("status"); el.textContent = msg; el.className = kind || "";
  // Don't pop the whole menu open — show a small message that fades by itself
  if (!$("bar").classList.contains("hidden")) return;
  const t = $("toast"); t.textContent = msg; t.className = kind || "";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), kind === "warn" ? 8000 : 4000);
}
const motion = CarMotion.create({ onState: (s) => { state = s; }, onStatus: setStatus });

// ---------------------------------------------------------------- UI
let debugOn = false, simOn = false, hideTimer = null, controlsOpen = false;
// Controls (menu bar + simulator panel) only open from the ⋯ button, and close by themselves
// after 8 s in car mode. In the simulator they stay until you tap ⋯ or Hide (or press H).
function setControls(open) {
  controlsOpen = open;
  $("bar").classList.toggle("hidden", !open);
  $("sim").classList.toggle("hidden", !(open && simOn));
  $("menuBtn").classList.toggle("open", open);
  document.body.classList.toggle("simmode", open && simOn);
  if (open) $("toast").classList.add("hidden");
  clearTimeout(hideTimer);
  if (open && !simOn) hideTimer = setTimeout(() => setControls(false), 8000);
  requestAnimationFrame(measure);
}
function showBar() { setControls(true); }
$("menuBtn").onclick = (e) => { e.stopPropagation(); setControls(!controlsOpen); };
$("hideBtn").onclick = () => setControls(false);
$("bar").addEventListener("pointerdown", () => { if (!simOn) { clearTimeout(hideTimer); hideTimer = setTimeout(() => setControls(false), 8000); } });
// Browsers only allow sound after a tap/click
addEventListener("pointerdown", () => Sfx.unlock(), { capture: true });
addEventListener("keydown", () => Sfx.unlock(), { capture: true });

// ---------------------------------------------------------------- Poke the face
let taps = [];
$("head").addEventListener("click", (e) => e.stopPropagation());   // tapping the face doesn't open the menu
$("head").addEventListener("pointerdown", (e) => {
  if (!$("intro").classList.contains("hidden")) return;
  e.stopPropagation();
  const now = performance.now(), r = $("head").getBoundingClientRect();
  const dx = clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2), -1, 1);
  const dy = clamp((e.clientY - (r.top + r.height / 2)) / (r.height / 2), -1, 1);
  if (!reducedMotion) { P.vx -= dx * 5; P.vy -= dy * 5; squash = { axis: Math.abs(dx) > Math.abs(dy) ? "x" : "y", side: Math.abs(dx) > Math.abs(dy) ? -Math.sign(dx) : -Math.sign(dy), a: 0.25 }; }
  // BOOP: tapping the nose gets its own reaction
  const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  const n = Dog.nose, vb = Dog.viewBox;
  const noseX = (n.x - vb.x) / vb.w, noseY = (n.y - vb.y) / vb.h;
  if (Math.hypot(nx - noseX, (ny - noseY) * (r.height / r.width)) < 0.1) {
    if (!reducedMotion) { squash = { axis: "z", side: 1, a: 0.6 }; P.vz -= 3; }
    if (sleeping || forceNap) { forceNap = false; parkedSince = null; }
    playAct([["giggle", 500], ["winking", 600]], 2, now);
    burst("poke", "BOOP!", (e.clientX / innerWidth) * 100, Math.max(8, (e.clientY / innerHeight) * 100 - 14));
    Sfx.play("boop");
    return;
  }
  taps = taps.filter((t) => now - t < 6000); taps.push(now);
  if (sleeping || forceNap) { forceNap = false; parkedSince = null; }      // poking wakes it up
  if (taps.length >= 7) {
    playAct([["furious", 1600]], 2, now); burst("poke", pick(["HEY!!", "STOP IT!", "GRR!"]), 50, 16); Sfx.play("hmph"); taps = [];
  } else if (taps.length >= 4) {
    playAct([["annoyed", 1200]], 2, now); burst("poke small", pick(["hey…", "ahem", "quit it"]), 50, 18); Sfx.play("hmph");
  } else if (Math.random() < 0.6) {
    playAct([["giggle", 900]], 2, now); Sfx.play("giggle");
  } else {
    playAct([["winking", 900]], 2, now); Sfx.play("poke");
  }
});
$("debugToggle").onclick = () => toggleDebug();
function toggleDebug() { debugOn = !debugOn; $("debug").classList.toggle("hidden", !debugOn); $("debugToggle").classList.toggle("on", debugOn); }

$("carBtn").onclick = async () => {
  $("intro").classList.add("hidden");
  $("menuBtn").classList.remove("hidden");
  setSim(false);
  try { await document.documentElement.requestFullscreen(); } catch (e) { /* optional */ }
  setTimeout(measure, 300);
  await motion.startSensors();
};
function enterSim() { $("intro").classList.add("hidden"); $("menuBtn").classList.remove("hidden"); setSim(true); }
$("simBtn").onclick = enterSim;
$("simToggle").onclick = () => setSim(!simOn);
$("calBtn").onclick = () => motion.calibrate();
$("relearnBtn").onclick = () => motion.relearnForward();
$("forgetBtn").onclick = () => motion.forgetCalibration();
function soundLabel() { $("soundBtn").textContent = Sfx.isOn() ? "Sound on" : "Sound off"; $("soundBtn").classList.toggle("on", Sfx.isOn()); }
$("soundBtn").onclick = () => { Sfx.setOn(!Sfx.isOn()); soundLabel(); if (Sfx.isOn()) Sfx.play("ding"); };
soundLabel();

// ---------------------------------------------------------------- Simulator
// A tiny car model: speed, longitudinal accel, yaw rate, and road noise.
const sim = { speed: 0, fwd: 0, yaw: 0, keys: {}, bump: false, timer: null, mult: 1 };
let replay = null;

function setSim(on) {
  simOn = on;
  $("simToggle").classList.toggle("on", on);
  clearInterval(sim.timer); sim.timer = null; replay = null;
  if (on) {
    motion.resetSim();
    sim.speed = 0; sim.fwd = 0; sim.yaw = 0;
    sim.timer = setInterval(simTick, 16);
    setStatus("Simulator — hold the buttons or use the arrow keys (Shift = dramatic).");
  }
  setControls(on);     // simulator opens with its controls; car mode starts with everything hidden
}

function simTick() {
  const dt = 0.016;
  if (replay) return replayTick(dt);
  const k = sim.keys;
  const moving = sim.speed > 0.3;
  let target = sim.speed > 0 ? -0.15 : 0;                 // rolling resistance
  if (k.gas) target = 1.8;
  if (k.floor) target = 3.4;
  if (k.brake) target = moving ? -1.8 : 0;
  if (k.hard) target = moving ? -4.0 : 0;
  sim.fwd += (target - sim.fwd) * (1 - Math.exp(-dt / 0.2));
  sim.speed = clamp(sim.speed + sim.fwd * dt, 0, 35);
  if (sim.speed === 0 && sim.fwd < 0) sim.fwd = 0;

  let turn = 0;
  if (k.left) turn += 16; if (k.right) turn -= 16;
  if (k.sharpLeft) turn += 34; if (k.sharpRight) turn -= 34;
  const yawTarget = turn * clamp(sim.speed / 6, 0, 1);               // °/s, + = left
  sim.yaw += (yawTarget - sim.yaw) * (1 - Math.exp(-dt / 0.25));
  const lat = clamp(-(sim.yaw * Math.PI / 180) * sim.speed, -6, 6);  // centripetal, + = right

  const rough = 0.08 + 0.5 * clamp(sim.speed / 10, 0, 1);              // road noise grows with speed
  const n = () => (Math.random() * 2 - 1) * rough;
  const vert = sim.bump ? 7 : n();
  sim.bump = false;
  motion.feed(sim.fwd + n(), lat + n(), sim.yaw + n() * 3, vert);
}

// Replay your real drive #2 log through the same engine
async function startReplay() {
  if (!simOn) setSim(true);
  setStatus("Loading drive #2…");
  const text = await (await fetch("sim/drive2.csv")).text();
  const rows = text.trim().split("\n").slice(1).map((l) => l.split(",").map(Number));
  const t0 = rows[0][0];
  replay = { rows: rows.map((r) => [r[0] - t0, r[1], r[2], r[3]]), i: 0, t: 0, clock: 0 };
  replay.end = replay.rows[replay.rows.length - 1][0];
  motion.resetSim();
  setStatus("Replaying drive #2 — left turn ~22s, bump ~38s, stop ~46s, hard accel ~51s, stop + right ~155s.", "ok");
}
function replayTick(dt) {
  replay.t += dt * sim.mult;
  const rows = replay.rows;
  while (replay.i < rows.length && rows[replay.i][0] <= replay.t) {
    const r = rows[replay.i++];
    replay.clock = r[0] * 1000;
    motion.feed(r[1], r[2], r[3], 0, replay.clock);
  }
  if (replay.i >= rows.length) { replay = null; motion.resetSim(); setStatus("Replay finished.", "ok"); }
}

document.querySelectorAll("#sim .hold").forEach((b) => {
  const k = b.dataset.k;
  const down = (e) => { e.preventDefault(); sim.keys[k] = true; b.classList.add("active"); replay = null; };
  const upFn = () => { sim.keys[k] = false; b.classList.remove("active"); };
  b.addEventListener("pointerdown", down);
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, upFn));
});
$("bumpBtn").onclick = () => { replay = null; sim.bump = true; };
$("replayBtn").onclick = startReplay;
$("speedBtn").onclick = () => { sim.mult = sim.mult === 1 ? 4 : 1; $("speedBtn").textContent = sim.mult + "×"; };
$("cruiseBtn").onclick = () => {      // pretend we've been cruising smoothly for a while
  replay = null; sim.keys = {}; sim.speed = Math.max(sim.speed, 25); lastEventAt = performance.now() - COOL_MS + 1500;
  setStatus("Highway test — cruising smoothly… sunglasses in a moment. Any brake/turn knocks them off.");
};
$("sickBtn").onclick = () => { const now = performance.now(); turnTimes = []; getSick(now); };
$("idleBtn").onclick = () => { nextIdleAt = 0; act = null; reactionUntil = 0; };
$("nightBtn").onclick = () => {
  nightForced = nightForced === null ? true : nightForced ? false : null;
  $("nightBtn").textContent = "Night: " + (nightForced === null ? "auto" : nightForced ? "on" : "off");
  updateNight();
};
$("napBtn").onclick = () => { replay = null; sim.keys = {}; sim.speed = 0; sim.fwd = 0; motion.resetSim();
  state = { ...state, fwd: 0, lat: 0, yaw: 0, activity: 0, event: "cruising" }; reactionUntil = 0; forceNap = true; };

// Arrow keys; Shift turns each into its dramatic version
const KEYMAP = { ArrowUp: ["gas", "floor"], ArrowDown: ["brake", "hard"], ArrowLeft: ["left", "sharpLeft"], ArrowRight: ["right", "sharpRight"] };
addEventListener("keydown", (e) => {
  if (e.key === "d" || e.key === "D") return toggleDebug();
  if ((e.key === "h" || e.key === "H") && $("intro").classList.contains("hidden")) return setControls(!controlsOpen);
  if (!simOn) { if (e.key === "s" || e.key === "S") enterSim(); return; }
  if (e.key === " ") { e.preventDefault(); replay = null; sim.bump = true; return; }
  if (e.key === "r" || e.key === "R") return startReplay();
  const m = KEYMAP[e.key];
  if (m) { e.preventDefault(); replay = null; sim.keys[m[e.shiftKey ? 1 : 0]] = true; }
});
addEventListener("keyup", (e) => {
  const m = KEYMAP[e.key];
  if (m) { sim.keys[m[0]] = false; sim.keys[m[1]] = false; }
});

if (new URLSearchParams(location.search).has("sim")) enterSim();
measure();
requestAnimationFrame(frame);
</script>
</body>
</html>
